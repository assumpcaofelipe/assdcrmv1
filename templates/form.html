<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../assets/css/cadastro.css"/>

    <title>Editar</title>
  </head>

  <body>
    <div class="container">
      <form action="lead_form.php" class="validacao-forms" method="post">
        <input type="hidden" name="id" value="{id}">

        <small class="error"></small>

        <fieldset class="step-1">
          <legend>Informações Essenciais - Dados da Empresa</legend>

          <div class="campo">
            <label for="">Nome da Empresa</label>
            <input
              type="text"
              name="empresa_nome"
              class="empresa"
              id="empresa"
              rules="required"
              value="{empresa}"
            />
          </div>

          <div class="campo">
            <label for="">E-mail</label>
            <input type="email" name="email" class="email" value="{email}" />
          </div>

          <div class="campo">
            <label for="">Telefone</label>
            <input
              type="text"
              name="telefone"
              class="telefone"
              value="{telefone}"
            />
          </div>

          <div class="campo">
            <label for="">Site da Empresa</label>
            <input
              type="text"
              name="empresa_site"
              class="site"
              value="{site}"
            />
          </div>
        </fieldset>

        <fieldset class="step-2">
          <legend>Responsável pela Decisão</legend>

          <div class="campo">
            <label for="">Nome do Decisor</label>
            <input
              type="text"
              name="decisor_nome"
              class="empresa"
              value="{decisornome}"
            />
          </div>

          <div class="campo">
            <label for="">Cargo do Decisor</label>
            <input
              type="text"
              name="decisor_cargo"
              class="cargo"
              value="{decisorcargo}"
            />
          </div>

          <div class="campo">
            <label for="">LinkedIn do Decisor</label>
            <input
              type="text"
              name="decisor_linkedin"
              class="linkedin_decisor"
              value="{decisorlinkedin}"
            />
          </div>
        </fieldset>

        <fieldset class="step-3">
          <legend>Acompanhamento da Negociação</legend>

          <div class="campo">
            <label for="status">Estágio do Lead</label>

            <select name="status" id="status">
              {status}
            </select>
          </div>

          <div class="campo">
            <label for="origem"> Origem do Lead </label>

            <select name="origem" id="origem">
              {origem}
            </select>
          </div>

          <div class="campo">
            <label for="primeiro_contato"> Primeiro Contato </label>

            <input
              type="datetime-local"
              id="primeiro_contato"
              name="primeiro_contato"
              value="{primeirocontato}"
            />
          </div>

          <div class="campo">
            <label for="proximo_contato"> Próximo Contato </label>

            <input
              type="datetime-local"
              id="proximo_contato"
              name="proximo_contato"
              value="{proximocontato}"
            />
          </div>

          <div class="campo">
            <label for="notes"> Notas </label>
              <textarea id="observacoes" name="observacoes">{notas}</textarea>
          </div>
        </fieldset>

        <div class="acoes">
          <input type="submit" value="Atualizar" />
        </div>
      </form>
    </div>

    <script src="<?= BASE_URL ?>/assets/js/form-validador.js"></script>
  </body>
</html>
